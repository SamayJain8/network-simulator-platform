services:
  core-engine:
    build:
      context: ../core-engine
      dockerfile: ../infra/core.Dockerfile
    environment:
      NETSIM_TELEMETRY_ENDPOINT: http://ai-service:8000/telemetry/stream
      NETSIM_DEMO_TRAFFIC: "true"
    ports:
      - "9090:9090"
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - netsim_net

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../infra/ai.Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - netsim_net

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../infra/dashboard.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - ai-service
    networks:
      - netsim_net

networks:
  netsim_net:
    driver: bridge
